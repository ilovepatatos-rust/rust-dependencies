name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Run dependency-free smoke tests
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }
