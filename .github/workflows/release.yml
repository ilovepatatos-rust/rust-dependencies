name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install Pester 6
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test
        shell: pwsh
        run: |
          ./tests/smoke.ps1
          $result = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }
      - name: Package versioned toolkit
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Tag version '$version' must be semver without a leading v (for example 1.2.3)."
          }
          $root = "rust-dependencies-$version"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $psd1Path = 'module/RustDependencies.psd1'
          $psd1 = Get-Content -LiteralPath $psd1Path -Raw
          $psd1 = [regex]::Replace($psd1, "ModuleVersion\s*=\s*'[^']+'", "ModuleVersion = '$version'")
          Set-Content -LiteralPath $psd1Path -Value $psd1 -NoNewline

          git archive --format=zip --prefix="$root/" --output="dist/$root.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed.' }

          Expand-Archive "dist/$root.zip" "dist/work"
          $stagedPsd1 = "dist/work/$root/module/RustDependencies.psd1"
          $staged = Get-Content -LiteralPath $stagedPsd1 -Raw
          $staged = [regex]::Replace($staged, "ModuleVersion\s*=\s*'[^']+'", "ModuleVersion = '$version'")
          Set-Content -LiteralPath $stagedPsd1 -Value $staged -NoNewline

          foreach ($rid in 'win-x64', 'linux-x64') {
            $out = "dist/work/$root/tools/RdPublicizer/bin/$rid"
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            dotnet publish tools/RdPublicizer/RdPublicizer.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $rid." }
            $exe = if ($rid -eq 'win-x64') { 'RdPublicizer.exe' } else { 'RdPublicizer' }
            if (-not (Test-Path (Join-Path $out $exe))) { throw "Missing published publicizer for $rid." }
          }

          if ($IsLinux) {
            & chmod u+x -- "dist/work/$root/tools/RdPublicizer/bin/linux-x64/RdPublicizer"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to mark linux-x64 RdPublicizer executable.' }
          }

          Remove-Item "dist/$root.zip" -Force
          Push-Location dist/work
          try {
            Compress-Archive -Path $root -DestinationPath "../$root.zip"
          }
          finally {
            Pop-Location
          }

          Expand-Archive "dist/$root.zip" "dist/verify"
          $entrypoints = @(Get-ChildItem "dist/verify" -Recurse -File -Filter Invoke-RustDependencies.ps1)
          if ($entrypoints.Count -ne 1) { throw "Expected one recursive entrypoint, found $($entrypoints.Count)." }
          if ($entrypoints[0].FullName -ne (Join-Path $PWD "dist/verify/$root/scripts/utility/Invoke-RustDependencies.ps1")) {
            throw 'The release entrypoint is not in scripts/utility/.'
          }
          $requiredScripts = @(
            'scripts/rust.ps1',
            'scripts/rust-staging.ps1',
            'scripts/rust+oxide.ps1',
            'scripts/rust-staging+oxide.ps1',
            'scripts/rust+carbon.ps1',
            'scripts/rust-staging+carbon.ps1',
            'scripts/rust+oxide+carbon.ps1',
            'scripts/rust-staging+oxide+carbon.ps1',
            'scripts/all.ps1',
            'scripts/rust/download.ps1',
            'scripts/rust/staging.ps1',
            'scripts/oxide/download.ps1',
            'scripts/oxide/staging.ps1',
            'scripts/carbon/download.ps1',
            'scripts/carbon/staging.ps1',
            'scripts/utility/public-dlls.ps1',
            'scripts/utility/private-dlls.ps1',
            'scripts/utility/publicize.ps1',
            'scripts/utility/Invoke-RustDependencies.ps1',
            'scripts/utility/Resolve-DefaultManifestPath.ps1'
          )
          $expectedRootScripts = @(
            'rust.ps1',
            'rust-staging.ps1',
            'rust+oxide.ps1',
            'rust-staging+oxide.ps1',
            'rust+carbon.ps1',
            'rust-staging+carbon.ps1',
            'rust+oxide+carbon.ps1',
            'rust-staging+oxide+carbon.ps1',
            'all.ps1'
          )
          $rootScripts = @((Get-ChildItem "dist/verify/$root/scripts" -File -Filter '*.ps1').Name | Sort-Object)
          if (@(Compare-Object $rootScripts ($expectedRootScripts | Sort-Object)).Count -ne 0) {
            throw "Expected only these wrappers directly under scripts/: $($expectedRootScripts -join ', ')."
          }
          $rootCmds = @(Get-ChildItem "dist/verify/$root/scripts" -File -Filter '*.cmd')
          if ($rootCmds.Count -ne 0) {
            throw 'Release archive must not include .cmd launchers under scripts/.'
          }
          foreach ($required in $requiredScripts + @(
            'download-dependencies.ps1',
            'module/RustDependencies.psd1',
            'module/RustDependencies.psm1',
            'examples/rust-dependencies.example.json',
            'examples/rust-staging-dependencies.example.json',
            'tools/RdPublicizer/RdPublicizer.csproj',
            'tools/RdPublicizer/bin/win-x64/RdPublicizer.exe',
            'tools/RdPublicizer/bin/linux-x64/RdPublicizer'
          )) {
            if (-not (Test-Path "dist/verify/$root/$required")) { throw "Release archive is missing $required." }
          }
          $manifestVersion = (Test-ModuleManifest "dist/verify/$root/module/RustDependencies.psd1").Version.ToString()
          if ($manifestVersion -ne $version) {
            throw "ModuleVersion '$manifestVersion' does not match release version '$version'."
          }
          Remove-Item "dist/verify" -Recurse -Force
          Remove-Item "dist/work" -Recurse -Force
      - name: Publish release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: dist/*.zip
          generate_release_notes: true
